name: Set up the project
description: pnpm, Node and the locked dependencies, as every CI job needs them. Run actions/checkout first.

runs:
  using: composite
  steps:
    # pnpm version comes from the `packageManager` field in package.json — do
    # NOT also set `version:` here (pnpm/action-setup errors on a duplicate).
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        # Match the Volta pin / .nvmrc — posthog-node requires node >=22.22.0.
        node-version: 22.23.1
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
