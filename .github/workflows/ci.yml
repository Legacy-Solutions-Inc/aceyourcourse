name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json — do
      # NOT also set `version:` here (pnpm/action-setup errors on a duplicate).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Volta pin / .nvmrc — posthog-node requires node >=22.22.0.
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type:check

      - run: pnpm test:coverage

      # The database tests, and the Admin e2e in live mode, run against a
      # throwaway local Supabase on the runner (spec Phase 2: Environments);
      # no test touches the hosted project. Postgres, auth (gotrue), Storage
      # and the API gateway (kong) start; every other service stays off.
      # `supabase start` applies supabase/migrations. Google's client id and
      # secret are unset here: the CLI warns and starts anyway.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - run: supabase start -x realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: pnpm test:db
        env:
          # The CLI's documented local default, not a secret.
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # A database that didn't start fails the run instead of skipping.
          TEST_DATABASE_REQUIRED: "true"

      - run: pnpm exec playwright install --with-deps chromium

      # Every Website and Admin journey on the in-memory sample data, as on a
      # developer's machine. The placeholders above never make a run live:
      # playwright.config.ts blanks the app's Supabase and database values.
      - run: pnpm test:e2e

      # The Admin journeys again, live on the runner's local Supabase (ticket
      # 16): Staff are password Users there, and the Guard reads them through
      # Supabase. Its URL and keys come from `supabase status`, for this step
      # only, with the secret key masked. playwright.config.ts refuses any
      # PLAYWRIGHT_* value that isn't local.
      - name: pnpm test:e2e --project admin (live on the local Supabase)
        run: |
          eval "$(supabase status -o env)"
          secret="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          echo "::add-mask::$secret"
          export PLAYWRIGHT_DATABASE_URL="$DB_URL"
          export PLAYWRIGHT_SUPABASE_URL="$API_URL"
          export PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export PLAYWRIGHT_SUPABASE_SECRET_KEY="$secret"
          pnpm test:e2e --project admin --no-deps

      - run: pnpm build

  # Dependency review runs only on pull requests (it diffs the base vs head
  # dependency manifests) and fails the PR on high-severity vulnerable deps.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
