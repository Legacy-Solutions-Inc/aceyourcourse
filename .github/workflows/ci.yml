name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json — do
      # NOT also set `version:` here (pnpm/action-setup errors on a duplicate).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Volta pin / .nvmrc — posthog-node requires node >=22.22.0.
          node-version: 22.23.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm type:check

      - run: pnpm test:coverage

      # The database tests run against a local Supabase (spec Phase 2:
      # Environments). Only Postgres is needed, so every other service stays
      # off. `supabase start` applies supabase/migrations.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0

      - run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: pnpm test:db
        env:
          # The CLI's documented local default, not a secret.
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # A database that didn't start fails the run instead of skipping.
          TEST_DATABASE_REQUIRED: "true"

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - run: pnpm build

  # Dependency review runs only on pull requests (it diffs the base vs head
  # dependency manifests) and fails the PR on high-severity vulnerable deps.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
