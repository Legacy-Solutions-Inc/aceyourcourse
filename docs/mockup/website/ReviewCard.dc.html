<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<figure style="margin:0;font-family:'Schibsted Grotesk',sans-serif;color:#0E1A2E;position:relative;transform:rotate({{ tilt }});background-color:#FFFDF8;border:1px solid #CFC6B2;box-shadow:0 1px 0 #CFC6B2,0 10px 18px -12px rgba(14,26,46,.35);padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px;min-height:220px">
  <span style="position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#FF881F;border:1.5px solid #0E1A2E;box-shadow:0 2px 0 rgba(14,26,46,.3)"></span>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid #FF881F;padding-bottom:10px;margin-bottom:2px">
    <span style="font-size:16px;letter-spacing:2px;line-height:1"><span style="color:#E07400">{{ s.on }}</span><span style="color:#D6CDB9">{{ s.off }}</span></span>
    <span style="font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.05em;text-transform:uppercase;color:#005AA5;border:1.5px solid #005AA5;padding:5px 6px">{{ r.exam }}</span>
  </div>
  <blockquote style="margin:0;font-size:16px;line-height:26px;background-image:repeating-linear-gradient(transparent 0 25px,#D5E2F0 25px 26px);white-space:pre-line;text-wrap:pretty">{{ r.text }}</blockquote>
  <figcaption style="margin-top:auto;display:flex;flex-direction:column;gap:4px;font:400 11px/1.45 'JetBrains Mono',monospace;color:#4A5568;padding-top:6px">
    <span style="color:#0E1A2E;font-weight:500">{{ r.product }}</span>
    <span>Variation: {{ variation }}</span>
    <sc-if value="{{ hasHelpful }}"><span>{{ r.helpful }} found this helpful</span></sc-if>
  </figcaption>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:300},&quot;r&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;min&quot;:-4,&quot;max&quot;:4,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this.props.r || { stars: 5, text: '' };
    const n = r.stars || 0;
    return { r, s: { on: '★'.repeat(n), off: '★'.repeat(5 - n) }, tilt: (this.props.tilt ?? 0) + 'deg',
      variation: r.variation || 'not specified', hasHelpful: r.helpful > 0 };
  }
}
</script>
</body>
</html>
