<body>
<x-dc>
<div style="width:100%;min-height:100vh;background:#F6F1E7">
  <sc-if value="{{ is.home }}" hint-placeholder-val="{{ true }}"><dc-import name="Home v2" mobile="{{ m }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.exam }}"><dc-import name="Exam v2" mobile="{{ m }}" exam="{{ exam }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.products }}"><dc-import name="Products v2" mobile="{{ m }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.product }}"><dc-import name="Product" mobile="{{ m }}" pid="{{ pid }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.about }}"><dc-import name="About v2" mobile="{{ m }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.faq }}"><dc-import name="FAQ v2" mobile="{{ m }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.reviews }}"><dc-import name="Reviews v2" mobile="{{ m }}" hint-size="100%,100vh"></dc-import></sc-if>
  <sc-if value="{{ is.legal }}"><dc-import name="Legal" mobile="{{ m }}" doc="{{ doc }}" hint-size="100%,100vh"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  static MAP = { 'Home v2': 'home', Home: 'home', 'Exam v2': 'exam', Exam: 'exam', ExamCE: 'exam', 'Products v2': 'products', Products: 'products', Product: 'product', ProductCEFlashCards: 'product', 'About v2': 'about', About: 'about', 'FAQ v2': 'faq', FAQ: 'faq', 'Reviews v2': 'reviews', Legal: 'legal' };
  static EXT = { MemberApp: 'AceYourCourse Member App.html', 'MemberApp v2': 'AceYourCourse Member App.html', AdminDashboard: 'AceYourCourse Admin.html', 'AdminDashboard v2': 'AceYourCourse Admin.html', AdminMobile: 'AceYourCourse Admin.html' };
  state = { page: 'home', q: {}, m: false };
  parseHash() {
    const h = location.hash.match(/^#!\/(\w+)(\?.*)?$/);
    return h && Component.MAP && Object.values(Component.MAP).includes(h[1]) ? { page: h[1], q: Object.fromEntries(new URLSearchParams(h[2] || '')) } : null;
  }
  componentDidMount() {
    this._rs = () => { const m = innerWidth < 760; if (m !== this.state.m) this.setState({ m }); };
    this._rs(); addEventListener('resize', this._rs);
    const init = this.parseHash(); if (init) this.setState(init);
    this._pop = () => { const r = this.parseHash(); if (r) this.go(r.page, r.q, '', true); };
    addEventListener('popstate', this._pop);
    this._ck = e => {
      if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      const mt = (a.getAttribute('href') || '').match(/^(?:\.\/)?([^?#\/]+)\.dc\.html(\?[^#]*)?(#.*)?$/); if (!mt) return;
      const name = decodeURIComponent(mt[1]); e.preventDefault();
      if (Component.EXT[name]) { location.href = new URL(Component.EXT[name], location.href).href; return; }
      const q = Object.fromEntries(new URLSearchParams(mt[2] || ''));
      if (name === 'ExamCE') q.exam = 'CE';
      this.go(Component.MAP[name] || 'home', q, (mt[3] || '').slice(1));
    };
    document.addEventListener('click', this._ck, true);
  }
  componentWillUnmount() { removeEventListener('resize', this._rs); removeEventListener('popstate', this._pop); document.removeEventListener('click', this._ck, true); }
  go(page, q, hash, fromPop) {
    if (!fromPop) { const qs = new URLSearchParams(q).toString(); try { history.pushState(null, '', '#!/' + page + (qs ? '?' + qs : '')); } catch (e) {} }
    this.setState({ page: null }, () => setTimeout(() => {
      this.setState({ page, q }); window.scrollTo(0, 0);
      if (hash) { let n = 0; const t = setInterval(() => { const el = document.getElementById(hash); if (el || ++n > 25) { clearInterval(t); el && window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 12, behavior: 'smooth' }); } }, 150); }
    }, 0));
  }
  renderVals() {
    const { page, q, m } = this.state, is = {};
    Object.values(Component.MAP).forEach(p => is[p] = page === p);
    return { is, m, exam: q.exam || 'CE', pid: q.id || '', doc: q.doc || 'privacy' };
  }
}
</script>
