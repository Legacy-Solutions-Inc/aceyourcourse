<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ p.href }}" target="{{ p.target }}" style="font-family:'Schibsted Grotesk',sans-serif;display:flex;flex-direction:column;aspect-ratio:2/3;background:#FBF8F1;border:1.5px solid #0E1A2E;box-shadow:7px 7px 0 -1.5px #EDE6D6,7px 7px 0 0 #0E1A2E;text-decoration:none;color:#0E1A2E;position:relative;min-width:0" style-hover="transform:translate(-2px,-2px);box-shadow:10px 10px 0 -1.5px #EDE6D6,10px 10px 0 0 #0E1A2E">
  <div style="flex:1 1 auto;min-height:200px;position:relative;overflow:hidden;border-bottom:1.5px solid #0E1A2E;background:repeating-linear-gradient(135deg,#EDE6D6 0 8px,#E6DECB 8px 16px)">
    <sc-if value="{{ p.img }}" hint-placeholder-val="{{ false }}"><img data-src="{{ p.img }}" alt="{{ p.short }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></sc-if>
    <span style="position:absolute;top:12px;left:12px;background:#005AA5;color:#F6F1E7;font:700 13px/1 'JetBrains Mono',monospace;padding:7px 9px;letter-spacing:.04em">{{ p.exam }}</span>
    <sc-if value="{{ p.deal }}"><span style="position:absolute;top:12px;right:12px;background:#FF881F;color:#0E1A2E;font:700 10px/1 'JetBrains Mono',monospace;padding:6px 7px;letter-spacing:.04em;text-transform:uppercase">Any 2 · 4% off</span></sc-if>
  </div>
  <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;background:#FBF8F1">
    <span style="font:500 11px/1.3 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#4A5568">{{ p.format }} · {{ p.size }}</span>
    <span style="font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance">{{ p.short }}</span>
    <span style="font:500 11px/1.3 'JetBrains Mono',monospace;color:#005AA5">{{ p.subjectsLine }}</span>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
      <sc-if value="{{ p.digital }}"><span style="font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.04em;background:#005AA5;color:#F6F1E7;padding:5px 6px">IN APP</span></sc-if>
      <span style="font:500 10px/1.2 'JetBrains Mono',monospace;letter-spacing:.03em;color:#4A5568">SHOPEE · LAZADA · TIKTOK SHOP</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed #C9BFA8;padding-top:10px;margin-top:2px">
      <span style="font-weight:800;font-size:20px;letter-spacing:-.01em">{{ p.priceLabel }}</span>
      <span style="font:500 12px 'JetBrains Mono',monospace;color:#4A5568;white-space:nowrap"><span style="color:#E07400">★</span> {{ p.ratingLabel }} · {{ p.soldLabel }}</span>
    </div>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:470},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { p: this.props.p || {}, hide: e => { e.target.style.visibility = 'hidden'; } };
  }
}
</script>
</body>
</html>
