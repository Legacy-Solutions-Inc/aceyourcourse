<script src="3e368403-729a-4405-b27a-9c0cbade7a0c"></script>

<body>
<x-dc>
<div style="width:100%;min-height:100vh;background:#F6F1E7"><dc-import name="MemberApp v2" mobile="{{ m }}" hint-size="100%,100vh"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script="">
class Component extends DCLogic {
  state = { m: false };
  componentDidMount() {
    this._rs = () => { const m = innerWidth < 760; if (m !== this.state.m) this.setState({ m }); };
    this._rs(); addEventListener('resize', this._rs);
    this._ck = e => {
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      const mt = (a.getAttribute('href') || '').match(/^(?:\.\/)?([^?#\/]+)\.dc\.html/); if (!mt) return;
      e.preventDefault(); const n = decodeURIComponent(mt[1]);
      location.href = new URL(/^Admin/.test(n) ? 'AceYourCourse Admin.html' : 'AceYourCourse Website.html', location.href).href;
    };
    document.addEventListener('click', this._ck, true);
  }
  componentWillUnmount() { removeEventListener('resize', this._rs); document.removeEventListener('click', this._ck, true); }
  renderVals() { return { m: this.state.m }; }
}
</script>
